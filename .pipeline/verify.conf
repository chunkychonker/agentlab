# What the verify gate runs, and when. See .pipeline/verify.sh.
#
# One rule per line:   path-prefix | label | command
# A rule runs when at least one path the cycle changed starts with its prefix.
# Commands run from the repo root under bash; exit 0 is a pass. Only the
# first two `|` on a line separate fields, so a command may use pipes.
#
# There is no rule for examples/: demo-mode increments have no common test
# command, so on those nights the gate reports NONE and the reviewer's own
# test run is the only one.

projects/nightloop/ | nightloop unit tests | cd projects/nightloop && python3 -I -m unittest discover
.pipeline/ | pipeline suites | rc=0; for t in .pipeline/test_*.sh; do bash "$t" >/dev/null 2>&1 || { echo "suite failed: $t (run it for the failing cases)"; rc=1; }; done; exit $rc
.claude/hooks/ | pipeline suites (hooks) | rc=0; for t in .pipeline/test_*.sh; do bash "$t" >/dev/null 2>&1 || { echo "suite failed: $t (run it for the failing cases)"; rc=1; }; done; exit $rc
