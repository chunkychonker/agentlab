# Which Claude model the build and review phases run on. Read once by run.sh
# (see .pipeline/models.sh for the rules). AGENTLAB_BUILD_MODEL and
# AGENTLAB_REVIEW_MODEL in the environment override these lines for one run.
#
# Accepted: opus, sonnet, fable, or a full name like claude-opus-5-5. Anything
# else aborts the night before any phase runs; there is no silent fallback.
# The fix round uses the build model. Research, maintain, replenish, health
# and the observer are fixed in run.sh and not set here.
#
# Both opus by default. Measure a change with `nightloop bench --model <name>`
# (projects/nightloop/docs/reviewer-benchmark.md) before making it.
build=opus
review=opus
