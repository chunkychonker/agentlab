# Generated by `nightloop schedule-gha` from examples/plugin.nightloop.toml.
# Re-run the generator instead of editing: the cron hour, the job timeout and
# the phase timeout were checked against that config's window and cycles when
# this file was made, and changing either without regenerating breaks the checks.
# Worst case: 1 cycle(s) x 3 phases at --timeout-s 3600,
# about 211 minutes with slack, within timeout-minutes 360.
# A late or dropped scheduled run is normal on GitHub; `nightloop run` refuses
# to start outside the window (exit 3), and that is not a fault.
name: nightloop

on:
  schedule:
    - cron: "17 1 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightloop-nightloop
  cancel-in-progress: false

jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TZ: "America/Chicago"
      DISABLE_AUTOUPDATER: "1"
    steps:
      - name: Check out the repo with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
          fetch-depth: 0
      - name: Check out nightloop at a pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chunkychonker/agentlab
          ref: fc4f54d69076443f0cfca76357baa8754bab4c41
          path: nightloop-src
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install Claude Code and nightloop
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.330
          python -m pip install ./nightloop-src/projects/nightloop
      - name: Set the git identity for the ship commit
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run one night
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: nightloop run --repo target --config target/examples/plugin.nightloop.toml --metrics nightloop-metrics/metrics.jsonl --timeout-s 3600
      - name: Upload the metrics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightloop-metrics
          path: nightloop-metrics/
          if-no-files-found: warn
